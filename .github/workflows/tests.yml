name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the minimum the standard-library helpers target; builtin
        # generics appear only in annotations guarded by
        # `from __future__ import annotations`. 3.14 is the current release.
        # A matrix entry only proves a run if that interpreter actually runs the
        # checks below; do not treat the config alone as a completed test.
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter version
        run: python -VV
      - name: Standard-library frontmatter and routing checks
        run: python context-cartographer/scripts/validate_skill.py
      - name: Behavioral smoke tests
        run: python context-cartographer/scripts/smoke_test.py
      - name: Unit and packaging tests
        run: python -m unittest discover -s context-cartographer/tests -v
